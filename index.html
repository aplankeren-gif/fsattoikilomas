<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* Mengikuti warna tema bawaan browser/perangkat user */
:root {
    --bg-color: #ffffff;
    --text-color: #1c1c1e;
    --spinner-border: rgba(0, 0, 0, 0.1);
    --spinner-active: #007aff;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #000000;
        --text-color: #f2f2f7;
        --spinner-border: rgba(255, 255, 255, 0.15);
        --spinner-active: #0a84ff;
    }
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--text-color);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

/* CONTAINER LOADING CENTER NATIVE LOOK */
.loader-container {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

/* Native Minimalist Spinner */
.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--spinner-border);
    border-top: 3px solid var(--spinner-active);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 14px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Teks Loading Clean */
.loading-text {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 3px;
}

.dots span {
    animation: blink 1.2s infinite fill-mode: both;
}

.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
    0% { opacity: .2; }
    20% { opacity: 1; }
    100% { opacity: .2; }
}
</style>

    en: "LOADING"
};
